name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run PHP static analysis
        run: composer types:check

      - name: Run PHP tests
        run: php artisan test

      - name: Check Node formatting
        run: npm run check

      - name: Check Node types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
            echo 'Docker is unavailable; skipping Docker Compose validation.'
            exit 0
          fi

          DB_DATABASE=meja DB_USERNAME=meja DB_PASSWORD=meja DB_ROOT_PASSWORD=root REVERB_APP_ID=ci REVERB_APP_KEY=ci-reverb-key REVERB_APP_SECRET=ci-reverb-secret docker compose config --quiet
