services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-meja}
            DB_USERNAME: ${DB_USERNAME:-meja}
            DB_PASSWORD: ${DB_PASSWORD:-change-me-before-production}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            FILESYSTEM_PUBLIC_DRIVER: ${FILESYSTEM_PUBLIC_DRIVER:-local}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - '${APP_PORT:-8080}:8080'
        volumes:
            - app-public:/var/www/html/storage/app/public
        restart: unless-stopped

    worker:
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-meja}
            DB_USERNAME: ${DB_USERNAME:-meja}
            DB_PASSWORD: ${DB_PASSWORD:-change-me-before-production}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --max-time=3600
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - app-public:/var/www/html/storage/app/public
        restart: unless-stopped

    scheduler:
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-meja}
            DB_USERNAME: ${DB_USERNAME:-meja}
            DB_PASSWORD: ${DB_PASSWORD:-change-me-before-production}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
        command: php artisan schedule:work
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - app-public:/var/www/html/storage/app/public
        restart: unless-stopped

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-meja}
            MYSQL_USER: ${DB_USERNAME:-meja}
            MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-before-production}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-before-production}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

volumes:
    app-public:
    mysql-data:
    redis-data:
