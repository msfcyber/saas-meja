services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
                VITE_REVERB_HOST: ${REVERB_HOST:?REVERB_HOST is required}
                VITE_REVERB_PORT: ${REVERB_EXTERNAL_PORT:-443}
                VITE_REVERB_SCHEME: ${REVERB_SCHEME:-https}
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            FILESYSTEM_PUBLIC_DRIVER: ${FILESYSTEM_PUBLIC_DRIVER:?FILESYSTEM_PUBLIC_DRIVER=s3 is required}
            REVERB_HOST: ${REVERB_INTERNAL_HOST:-reverb}
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
            REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started
        ports:
            - '${HTTPS_PORT:-443}:8443'
        volumes:
            - app-public:/var/www/html/storage/app/public
            - ${TLS_CERTS_PATH:?TLS_CERTS_PATH is required}:/etc/nginx/tls:ro
        restart: unless-stopped

    reverb:
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            REVERB_HOST: ${REVERB_INTERNAL_HOST:-reverb}
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
            REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    worker:
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            REVERB_HOST: ${REVERB_INTERNAL_HOST:-reverb}
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
            REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --max-time=3600
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - app-public:/var/www/html/storage/app/public
        restart: unless-stopped

    scheduler:
        image: meja-app:local
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            REVERB_HOST: ${REVERB_INTERNAL_HOST:-reverb}
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
            REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
        command: php artisan schedule:work
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - app-public:/var/www/html/storage/app/public
        restart: unless-stopped

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

volumes:
    app-public:
    mysql-data:
    redis-data:
